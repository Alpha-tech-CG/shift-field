<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2e9e5b" />
  <title>Field Shift — Panel</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="offline-banner" data-i18n="common.offline"></div>

  <header class="flex items-center justify-between px-4 py-3">
    <h1 class="font-bold text-lg" data-i18n="panel.title"></h1>
    <button onclick="FSI18N.toggle()" class="text-sm border rounded-full px-3 py-1 bg-white" data-i18n="common.lang"></button>
  </header>

  <!-- Estado de carga -->
  <div id="loading" class="px-4 py-16 text-center text-gray-500">
    <div class="spin inline-block w-8 h-8 border-4 border-gray-300 rounded-full" style="border-top-color:var(--fs-green)"></div>
    <p class="mt-3" data-i18n="common.loading"></p>
  </div>

  <main id="content" class="px-4 max-w-xl mx-auto hidden">
    <div id="mock-flag" class="mb-3 hidden"><span class="mock-chip">⚙️ datos simulados (mock)</span></div>

    <!-- Riesgo -->
    <section class="fs-card p-5 mb-4 flex items-center gap-5">
      <div class="gauge" id="gauge"></div>
      <div>
        <p class="text-sm text-gray-500" data-i18n="panel.risk"></p>
        <p id="risk-label" class="text-2xl font-extrabold"></p>
        <p id="risk-score" class="text-sm text-gray-500"></p>
      </div>
    </section>

    <!-- Presupuesto de agua -->
    <section class="fs-card p-5 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold" data-i18n="panel.water"></h2>
        <span id="water-status" class="text-sm font-semibold rounded-full px-3 py-1"></span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden mb-3">
        <div id="water-bar" class="h-4 rounded-full" style="background:var(--fs-blue);width:0%"></div>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-sm">
        <div><p class="text-gray-500" data-i18n="panel.need"></p><p id="w-need" class="font-bold"></p></div>
        <div><p class="text-gray-500" data-i18n="panel.available"></p><p id="w-avail" class="font-bold" style="color:var(--fs-blue)"></p></div>
        <div><p class="text-gray-500" data-i18n="panel.deficit"></p><p id="w-deficit" class="font-bold" style="color:var(--fs-red)"></p></div>
      </div>
      <p id="w-explain" class="text-sm text-gray-600 mt-3"></p>
    </section>

    <!-- Línea de tiempo de siembra -->
    <section class="fs-card p-5 mb-4">
      <h2 class="font-bold mb-2" data-i18n="panel.timeline"></h2>
      <p id="plant-reco" class="text-xl font-extrabold mb-1"></p>
      <p class="text-sm text-gray-500"><span data-i18n="plant.window"></span>: <span id="plant-window" class="font-semibold"></span></p>
      <p id="plant-reason" class="text-sm text-gray-600 mt-2"></p>
    </section>

    <!-- Lluvia 60 días vs normal -->
    <section class="fs-card p-5 mb-4">
      <h2 class="font-bold mb-2" data-i18n="panel.indicators"></h2>
      <canvas id="rain-chart" height="160"></canvas>
      <div id="indicators" class="grid grid-cols-2 gap-2 mt-4 text-sm"></div>
    </section>

    <!-- Rotaciones -->
    <section class="mb-4">
      <h2 class="font-bold mb-2 px-1" data-i18n="panel.rotations"></h2>
      <div id="rotations" class="grid gap-3"></div>
    </section>

    <!-- Explicación -->
    <section class="fs-card p-5 mb-4">
      <h2 class="font-bold mb-2" data-i18n="panel.ai"></h2>
      <p id="ai-explain" class="text-sm text-gray-700"></p>
    </section>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <a href="/cooperativa.html" class="text-center border rounded-2xl py-3 bg-white font-semibold text-sm" data-i18n="panel.cooperativa"></a>
      <a href="/copiloto.html" class="text-center rounded-2xl py-3 text-white font-semibold text-sm" style="background:var(--fs-green)" data-i18n="panel.ask"></a>
    </div>
  </main>

  <nav class="fs-nav">
    <a href="/index.html"><span>🏠</span><span data-i18n="nav.home"></span></a>
    <a href="/campo.html"><span>🗺️</span><span data-i18n="nav.field"></span></a>
    <a href="/perfil.html"><span>🧑‍🌾</span><span data-i18n="nav.profile"></span></a>
    <a href="/panel.html" class="active"><span>📊</span><span data-i18n="nav.panel"></span></a>
    <a href="/copiloto.html"><span>💬</span><span data-i18n="nav.copilot"></span></a>
  </nav>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
