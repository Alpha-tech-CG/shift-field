<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#DEDEDA" />
  <title>Field Shift — Tableau de bord</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/fieldshift.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body data-page="dashboard">
  <div class="frame">
    <header id="topbar"></header>

    <div id="loading" class="loading"><div class="spinner"></div><p data-i18n="common.loading"></p></div>

    <main id="content" class="hidden">
      <div class="grid-dash">
        <!-- Bandeau photo -->
        <section class="hero span-2" style="background-image:url('/img/field.jpg')">
          <div class="hero-top">
            <span class="badge badge-glass" id="hero-parcel"></span>
            <span id="hero-stamp"></span>
          </div>
          <div class="hero-card">
            <p class="eyebrow" data-i18n="dash.today"></p>
            <h2 id="hero-reco"></h2>
            <p id="hero-reason"></p>
          </div>
        </section>

        <!-- Suivi du champ -->
        <section class="card">
          <div class="card-head">
            <h2 class="card-title" data-i18n="mon.title"></h2>
            <span class="badge badge-green" id="mon-badge"></span>
          </div>
          <p class="xs faint" id="mon-date"></p>
          <div class="mon-temp">
            <span class="big" id="mon-temp"></span>
            <div class="xs muted"><div id="mon-l1"></div><div id="mon-l2"></div></div>
          </div>
          <div class="ring-wrap">
            <div id="mon-ring"></div>
            <div class="ring-label"><div><div class="num" id="mon-score"></div><div class="small bold" id="mon-level"></div></div></div>
          </div>
          <div class="tiles" id="mon-tiles"></div>
          <a class="card-foot" href="/analyse.html">
            <span style="display:flex;align-items:center;gap:6px"><iconify-icon icon="solar:info-circle-linear" width="16" height="16"></iconify-icon><span data-i18n="mon.link"></span></span>
            <iconify-icon icon="solar:alt-arrow-right-linear" width="16" height="16"></iconify-icon>
          </a>
        </section>

        <!-- Calendrier de semis -->
        <section class="card">
          <div class="card-head">
            <div><h2 class="card-title" data-i18n="cal.title"></h2><p class="card-sub" data-i18n="cal.sub"></p></div>
            <a class="round-btn" href="/plan.html" aria-label="Plan"><iconify-icon icon="solar:maximize-square-minimalistic-linear" width="18" height="18"></iconify-icon></a>
          </div>
          <div class="weekbar" id="cal-weeks"></div>
          <div class="cal-area" id="cal-area"></div>
          <div class="cal-axis" id="cal-axis"></div>
          <p class="small muted" id="cal-text" style="margin-top:12px"></p>
        </section>

        <!-- Santé du champ -->
        <section class="card">
          <div class="card-head">
            <h2 class="card-title" data-i18n="ins.title"></h2>
            <select class="select" id="ins-var" style="width:auto;height:38px;border-radius:999px;padding:0 12px;background:#fff" aria-label="Variable"></select>
          </div>
          <p class="xs muted" data-i18n="ins.score"></p>
          <p style="margin-top:2px"><span class="num" id="ins-score" style="font-size:30px"></span><span class="faint"> /100</span></p>
          <p class="xs" id="ins-delta" style="margin-bottom:8px"></p>
          <div class="chart-box"><canvas id="ins-chart"></canvas></div>
        </section>

        <!-- Météo & eau -->
        <section class="card">
          <div class="card-head">
            <h2 class="card-title" data-i18n="wx.title"></h2>
            <span class="small bold" data-i18n="wx.today"></span>
          </div>
          <div class="wx-row">
            <div class="wx-big" id="wx-temp"></div>
            <div class="wx-list" id="wx-list"></div>
          </div>
          <div class="stripes" id="wx-stripes"></div>
          <a class="btn btn-dark btn-block" href="/plan.html" data-i18n="wx.report"></a>
        </section>
      </div>
    </main>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
