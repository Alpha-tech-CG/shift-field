<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <title>Field Shift — Plan</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-background: var(--background); --color-foreground: var(--foreground);
      --color-primary: var(--primary); --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary); --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted); --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent); --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive);
      --color-card: var(--card); --color-card-foreground: var(--card-foreground);
      --color-border: var(--border); --color-input: var(--input); --color-ring: var(--ring);
      --color-chart-1: var(--chart-1); --color-chart-2: var(--chart-2); --color-chart-3: var(--chart-3);
      --color-chart-4: var(--chart-4); --color-chart-5: var(--chart-5);
      --font-sans: var(--font-sans); --font-heading: var(--font-heading, var(--font-sans));
      --radius-2xl: calc(var(--radius) + 8px); --radius-3xl: calc(var(--radius) + 16px);
    }
    @layer base { body { @apply bg-background text-foreground font-sans; } }
    :root {
      --shape: squircle;
      --background:#F8FAFC; --foreground:#0F172A;
      --primary:#2563EB; --primary-foreground:#FFFFFF;
      --secondary:#14B8A6; --secondary-foreground:#FFFFFF;
      --muted:#E2E8F0; --muted-foreground:#64748B;
      --accent:#F59E0B; --accent-foreground:#172554;
      --destructive:#DC2626;
      --card:#FFFFFF; --card-foreground:#0F172A;
      --border:#E2E8F0; --input:#F1F5F9; --ring:#2563EB;
      --chart-1:#2563EB; --chart-2:#14B8A6; --chart-3:#F59E0B; --chart-4:#16A34A; --chart-5:#8B5CF6;
      --font-sans:"Inter",sans-serif; --font-heading:"Manrope",sans-serif;
      --radius:0.75rem;
    }
    * { corner-shape: var(--shape, round); }
    iconify-icon:not([width]):not([height]) { display:inline-block; width:1em; height:1em; }
    *,*::before,*::after { scrollbar-width:none; -ms-overflow-style:none; }
    *::-webkit-scrollbar { display:none; }
  </style>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="offline-banner" data-i18n="common.offline"></div>
  <div class="mx-auto max-w-md min-h-screen bg-background pb-36 font-sans text-foreground">
    <header class="flex items-center justify-between px-6 pt-8 pb-4">
      <h1 class="font-heading text-3xl font-bold leading-tight" data-i18n="panel.title"></h1>
      <button data-lang-label onclick="FSI18N.cycle()"
        class="size-11 rounded-2xl bg-card border border-border text-sm font-semibold"></button>
    </header>

    <div id="loading" class="px-6 py-20 text-center text-muted-foreground">
      <div class="spin inline-block size-9 rounded-full border-4 border-muted" style="border-top-color:#2563EB"></div>
      <p class="mt-3" data-i18n="common.loading"></p>
    </div>

    <main id="content" class="px-6 space-y-5 hidden">
      <div id="mock-flag" class="hidden"></div>
      <!-- safelist : classes injectées par le JS, pour que Tailwind les compile -->
      <div class="hidden border-2 border-secondary bg-secondary text-secondary-foreground bg-accent/20 text-accent-foreground bg-primary/10 text-primary text-chart-4 text-destructive bg-muted/60 rounded-xl p-2 font-bold"></div>

      <!-- Risque -->
      <section class="rounded-3xl bg-card border border-border p-5 flex items-center gap-5">
        <div id="gauge" class="relative shrink-0" style="width:140px;height:140px"></div>
        <div>
          <p class="text-sm text-muted-foreground" data-i18n="panel.risk"></p>
          <p id="risk-label" class="font-heading text-3xl font-bold leading-tight"></p>
          <p id="risk-score" class="text-sm text-muted-foreground"></p>
        </div>
      </section>

      <!-- Budget d'eau -->
      <section class="rounded-3xl bg-card border border-border p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-heading text-xl font-bold" data-i18n="panel.water"></h2>
          <span id="water-status" class="rounded-full px-3 py-1 text-sm font-semibold"></span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-2xl bg-muted/60 p-4">
            <p class="text-sm text-muted-foreground" data-i18n="panel.available"></p>
            <p id="w-avail" class="font-heading text-2xl font-bold text-chart-1"></p>
          </div>
          <div class="rounded-2xl bg-muted/60 p-4">
            <p class="text-sm text-muted-foreground" data-i18n="panel.need"></p>
            <p id="w-need" class="font-heading text-2xl font-bold"></p>
          </div>
        </div>
        <div class="mt-4 h-3 w-full rounded-full bg-muted overflow-hidden">
          <div id="water-bar" class="h-full rounded-full bg-chart-1" style="width:0%"></div>
        </div>
        <p class="mt-3 text-base text-muted-foreground">
          <span data-i18n="panel.deficit"></span> : <span id="w-deficit" class="font-semibold text-destructive"></span>
        </p>
        <p id="w-explain" class="mt-1 text-base text-muted-foreground"></p>
      </section>

      <!-- Quand semer -->
      <section class="rounded-3xl bg-accent/15 border border-accent p-6">
        <p class="text-base font-medium text-muted-foreground" data-i18n="panel.timeline"></p>
        <h2 id="plant-reco" class="font-heading text-3xl font-bold leading-tight mt-1"></h2>
        <p class="mt-1 text-sm text-muted-foreground"><span data-i18n="plant.window"></span> : <span id="plant-window" class="font-semibold"></span></p>
        <p id="plant-reason" class="mt-2 text-base"></p>
        <div class="mt-5 grid grid-cols-3 gap-2 text-center">
          <div class="space-y-2">
            <div class="mx-auto size-14 rounded-full bg-accent text-accent-foreground flex items-center justify-center">
              <iconify-icon icon="solar:clock-circle-bold" width="26" height="26"></iconify-icon>
            </div>
            <p class="text-sm font-semibold" data-i18n="plant.step_wait"></p>
          </div>
          <div class="space-y-2">
            <div class="mx-auto size-14 rounded-full bg-card border border-border text-primary flex items-center justify-center">
              <iconify-icon icon="mdi:plant" width="26" height="26"></iconify-icon>
            </div>
            <p class="text-sm font-semibold" data-i18n="plant.step_plant"></p>
          </div>
          <div class="space-y-2">
            <div class="mx-auto size-14 rounded-full bg-card border border-border text-destructive flex items-center justify-center">
              <iconify-icon icon="solar:danger-triangle-linear" width="26" height="26"></iconify-icon>
            </div>
            <p class="text-sm font-semibold" data-i18n="plant.step_risk"></p>
          </div>
        </div>
      </section>

      <!-- Indicateurs NASA + graphiques -->
      <section class="rounded-3xl bg-card border border-border p-5">
        <h2 class="font-heading text-xl font-bold mb-3" data-i18n="panel.indicators"></h2>
        <p class="text-xs font-semibold text-muted-foreground mb-1" data-i18n="chart.rainfall"></p>
        <canvas id="rain-chart" height="150"></canvas>
        <p class="text-xs font-semibold text-muted-foreground mb-1 mt-5" data-i18n="chart.soil"></p>
        <canvas id="soil-chart" height="150"></canvas>
        <p class="text-xs font-semibold text-muted-foreground mb-1 mt-5" data-i18n="chart.ndvi"></p>
        <canvas id="ndvi-chart" height="150"></canvas>
        <p class="text-xs font-semibold text-muted-foreground mb-1 mt-5" data-i18n="chart.climate"></p>
        <canvas id="climate-chart" height="160"></canvas>
        <div id="indicators" class="grid grid-cols-2 gap-2 mt-5 text-sm"></div>
      </section>

      <!-- Rotations -->
      <section class="space-y-3">
        <div>
          <h2 class="font-heading text-xl font-bold" data-i18n="panel.rotations"></h2>
          <p class="text-base text-muted-foreground" data-i18n="panel.rotations.sub"></p>
        </div>
        <div id="rotations" class="space-y-3"></div>
      </section>

      <!-- Explication -->
      <section class="rounded-3xl bg-card border border-border p-5">
        <h2 class="font-heading text-xl font-bold mb-2" data-i18n="panel.ai"></h2>
        <p id="ai-explain" class="text-base text-muted-foreground"></p>
      </section>

      <div class="grid grid-cols-2 gap-3">
        <a href="/cooperativa.html" class="flex items-center justify-center h-14 rounded-2xl bg-card border border-border text-sm font-semibold text-center px-2" data-i18n="panel.cooperativa"></a>
        <a href="/copiloto.html" class="flex items-center justify-center h-14 rounded-2xl bg-primary text-primary-foreground text-sm font-semibold text-center px-2" data-i18n="panel.ask"></a>
      </div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 mx-auto max-w-md bg-card border-t border-border grid grid-cols-5 px-2 pt-2 pb-4">
      <a href="/index.html" class="flex flex-col items-center gap-1 text-sm font-medium text-muted-foreground">
        <span class="flex h-9 w-16 items-center justify-center"><iconify-icon icon="solar:home-2-linear" width="26" height="26"></iconify-icon></span><span data-i18n="nav.home"></span></a>
      <a href="/campo.html" class="flex flex-col items-center gap-1 text-sm font-medium text-muted-foreground">
        <span class="flex h-9 w-16 items-center justify-center"><iconify-icon icon="solar:map-point-linear" width="26" height="26"></iconify-icon></span><span data-i18n="nav.map"></span></a>
      <a href="/panel.html" class="flex flex-col items-center gap-1 text-sm font-semibold text-primary">
        <span class="flex h-9 w-16 items-center justify-center rounded-full bg-primary/10"><iconify-icon icon="mdi:plant" width="26" height="26"></iconify-icon></span><span data-i18n="nav.plan"></span></a>
      <a href="/copiloto.html" class="flex flex-col items-center gap-1 text-sm font-medium text-muted-foreground">
        <span class="flex h-9 w-16 items-center justify-center"><iconify-icon icon="solar:chat-round-dots-linear" width="26" height="26"></iconify-icon></span><span data-i18n="nav.assistant"></span></a>
      <a href="/perfil.html" class="flex flex-col items-center gap-1 text-sm font-medium text-muted-foreground">
        <span class="flex h-9 w-16 items-center justify-center"><iconify-icon icon="solar:user-circle-linear" width="26" height="26"></iconify-icon></span><span data-i18n="nav.profile"></span></a>
    </nav>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
