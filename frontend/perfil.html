<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#DEDEDA" />
  <title>Field Shift — Profil</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/fieldshift.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body data-page="profile">
  <div class="frame">
    <header id="topbar"></header>

    <div class="page-head" style="max-width:900px;margin-left:auto;margin-right:auto">
      <div><h1 data-i18n="profile.title"></h1><p class="sub" data-i18n="profile.sub"></p></div>
    </div>

    <section class="card stack" style="max-width:900px;margin:0 auto;gap:28px">
      <div>
        <span class="field-label" data-i18n="profile.crop"></span>
        <div class="choice-grid">
          <button type="button" class="choice crop-btn" data-crop="maize"><span class="h-ico"><iconify-icon icon="mdi:corn" width="24" height="24"></iconify-icon></span><span data-i18n="crop.maize"></span></button>
          <button type="button" class="choice crop-btn" data-crop="beans"><span class="h-ico"><iconify-icon icon="mdi:seed-outline" width="24" height="24"></iconify-icon></span><span data-i18n="crop.beans"></span></button>
          <button type="button" class="choice crop-btn" data-crop="sorghum"><span class="h-ico"><iconify-icon icon="mdi:grass" width="24" height="24"></iconify-icon></span><span data-i18n="crop.sorghum"></span></button>
          <button type="button" class="choice crop-btn" data-crop="millet"><span class="h-ico"><iconify-icon icon="mdi:sprout" width="24" height="24"></iconify-icon></span><span data-i18n="crop.millet"></span></button>
          <button type="button" class="choice crop-btn" data-crop="cover_crop"><span class="h-ico"><iconify-icon icon="solar:leaf-bold" width="24" height="24"></iconify-icon></span><span data-i18n="crop.cover_crop"></span></button>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <span class="field-label" data-i18n="profile.soil"></span>
          <select id="soil" class="select">
            <option value="sandy" data-i18n="soil.sandy"></option>
            <option value="sandy_loam" selected data-i18n="soil.sandy_loam"></option>
            <option value="loam" data-i18n="soil.loam"></option>
            <option value="clay_loam" data-i18n="soil.clay_loam"></option>
            <option value="clay" data-i18n="soil.clay"></option>
          </select>
        </div>
        <div>
          <span class="field-label" data-i18n="profile.irrigation"></span>
          <div class="pills">
            <button type="button" class="pill-opt irr-btn" data-irr="false" data-i18n="profile.irrigation.no"></button>
            <button type="button" class="pill-opt irr-btn" data-irr="true" data-i18n="profile.irrigation.yes"></button>
          </div>
        </div>
      </div>

      <div>
        <span class="field-label" data-i18n="profile.priority"></span>
        <div class="pills">
          <button type="button" class="pill-opt prio-btn" data-prio="save_water" data-i18n="profile.prio.water"></button>
          <button type="button" class="pill-opt prio-btn" data-prio="balanced" data-i18n="profile.prio.balanced"></button>
          <button type="button" class="pill-opt prio-btn" data-prio="max_yield" data-i18n="profile.prio.yield"></button>
        </div>
      </div>

      <button id="submit-btn" class="btn btn-dark btn-block" data-i18n="profile.submit"></button>
    </section>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/perfil.js"></script>
</body>
</html>
