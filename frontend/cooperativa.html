<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#DEDEDA" />
  <title>Field Shift — Carte coopérative</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/fieldshift.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body data-page="coop">
  <div class="frame">
    <header id="topbar"></header>

    <div class="page-head no-print" style="max-width:680px;margin-left:auto;margin-right:auto">
      <div><h1 data-i18n="coop.title"></h1><p class="sub" data-i18n="coop.help"></p></div>
      <button class="btn btn-dark" onclick="window.print()"><iconify-icon icon="solar:printer-linear" width="18" height="18"></iconify-icon><span data-i18n="coop.print"></span></button>
    </div>

    <section id="card" class="card" style="max-width:680px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px">
        <span class="brand" style="font-size:18px"><iconify-icon icon="mdi:sprout" width="26" height="26" style="color:var(--green)"></iconify-icon>Field Shift</span>
        <span class="xs faint" id="c-coords"></span>
      </div>
      <div class="stack" style="gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span class="muted" data-i18n="coop.risk"></span>
          <span class="badge" id="c-risk" style="color:#fff"></span>
        </div>
        <div><p class="xs muted" data-i18n="coop.water"></p><p class="bold" id="c-water"></p></div>
        <div><p class="xs muted" data-i18n="coop.rotation"></p><p class="bold" id="c-rotation"></p></div>
        <div><p class="xs muted" data-i18n="coop.planting"></p><p class="bold" id="c-planting"></p></div>
        <div><p class="xs muted" data-i18n="coop.actions"></p><p class="bold" id="c-actions"></p></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);margin-top:18px;padding-top:16px;gap:14px">
        <div class="xs muted" style="max-width:60%">
          <p class="bold" data-i18n="coop.sources"></p>
          <p>GPM IMERG · SMAP · MODIS · NASA POWER · GRACE-FO</p>
        </div>
        <div style="text-align:center">
          <div id="qr" style="display:inline-block"></div>
          <p class="xs faint" data-i18n="coop.scan"></p>
        </div>
      </div>
    </section>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/cooperativa.js"></script>
</body>
</html>
