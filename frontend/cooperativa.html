<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <title>Field Shift — Coopérative</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-background: var(--background); --color-foreground: var(--foreground);
      --color-primary: var(--primary); --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary); --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted); --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent); --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive);
      --color-card: var(--card); --color-card-foreground: var(--card-foreground);
      --color-border: var(--border); --color-input: var(--input); --color-ring: var(--ring);
      --color-chart-1: var(--chart-1); --color-chart-2: var(--chart-2); --color-chart-3: var(--chart-3);
      --color-chart-4: var(--chart-4); --color-chart-5: var(--chart-5);
      --font-sans: var(--font-sans); --font-heading: var(--font-heading, var(--font-sans));
      --radius-2xl: calc(var(--radius) + 8px); --radius-3xl: calc(var(--radius) + 16px);
    }
    @layer base { body { @apply bg-background text-foreground font-sans; } }
    :root {
      --shape: squircle;
      --background:#F8FAFC; --foreground:#0F172A;
      --primary:#2563EB; --primary-foreground:#FFFFFF;
      --secondary:#14B8A6; --secondary-foreground:#FFFFFF;
      --muted:#E2E8F0; --muted-foreground:#64748B;
      --accent:#F59E0B; --accent-foreground:#172554;
      --destructive:#DC2626;
      --card:#FFFFFF; --card-foreground:#0F172A;
      --border:#E2E8F0; --input:#F1F5F9; --ring:#2563EB;
      --chart-1:#2563EB; --chart-2:#14B8A6; --chart-3:#F59E0B; --chart-4:#16A34A; --chart-5:#8B5CF6;
      --font-sans:"Inter",sans-serif; --font-heading:"Manrope",sans-serif;
      --radius:0.75rem;
    }
    * { corner-shape: var(--shape, round); }
    iconify-icon:not([width]):not([height]) { display:inline-block; width:1em; height:1em; }
    *,*::before,*::after { scrollbar-width:none; -ms-overflow-style:none; }
    *::-webkit-scrollbar { display:none; }
  </style>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="offline-banner" data-i18n="common.offline"></div>
  <div class="mx-auto max-w-md min-h-screen bg-background pb-36 font-sans text-foreground">
    <header class="flex items-center justify-between px-6 pt-8 pb-5 no-print">
      <h1 class="font-heading text-2xl font-bold" data-i18n="coop.title"></h1>
      <div class="flex gap-2">
        <button data-lang-label onclick="FSI18N.cycle()" class="size-11 rounded-2xl bg-card border border-border text-sm font-semibold"></button>
        <button onclick="window.print()" class="h-11 px-4 rounded-2xl bg-primary text-primary-foreground text-sm font-semibold" data-i18n="coop.print"></button>
      </div>
    </header>

    <main class="px-6">
      <p class="text-base text-muted-foreground mb-3 no-print" data-i18n="coop.help"></p>

      <div id="card" class="print-card rounded-3xl bg-card border border-border p-6">
        <div class="flex items-center justify-between border-b border-border pb-3 mb-4">
          <div class="flex items-center gap-2">
            <div class="size-9 rounded-xl bg-primary text-primary-foreground flex items-center justify-center">
              <iconify-icon icon="solar:leaf-bold" width="20" height="20"></iconify-icon>
            </div>
            <span class="font-heading font-bold">Field Shift</span>
          </div>
          <span id="c-coords" class="text-xs text-muted-foreground"></span>
        </div>

        <div class="space-y-4 text-base">
          <div class="flex items-center justify-between">
            <span class="text-muted-foreground" data-i18n="coop.risk"></span>
            <span id="c-risk" class="font-semibold text-white rounded-full px-3 py-1 text-sm"></span>
          </div>
          <div>
            <p class="text-muted-foreground text-sm" data-i18n="coop.water"></p>
            <p id="c-water" class="font-semibold"></p>
          </div>
          <div>
            <p class="text-muted-foreground text-sm" data-i18n="coop.rotation"></p>
            <p id="c-rotation" class="font-semibold"></p>
          </div>
          <div>
            <p class="text-muted-foreground text-sm" data-i18n="coop.planting"></p>
            <p id="c-planting" class="font-semibold"></p>
          </div>
          <div>
            <p class="text-muted-foreground text-sm" data-i18n="coop.actions"></p>
            <p id="c-actions" class="font-semibold"></p>
          </div>
        </div>

        <div class="flex items-end justify-between border-t border-border mt-4 pt-4">
          <div class="text-xs text-muted-foreground max-w-[60%]">
            <p class="font-semibold mb-1" data-i18n="coop.sources"></p>
            <p>GPM · SMAP · MODIS · NASA POWER · GRACE-FO</p>
          </div>
          <div class="text-center">
            <div id="qr" class="inline-block"></div>
            <p class="text-[10px] text-muted-foreground mt-1" data-i18n="coop.scan"></p>
          </div>
        </div>
      </div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 mx-auto max-w-md bg-card border-t border-border grid grid-cols-5 px-2 pt-2 pb-4 no-print">
      <a href="/index.html" class="flex flex-col items-center gap-1 text-sm font-medium text-muted-foreground">
        <span class="flex h-9 w-16 items-center justify-center"><iconify-icon icon="solar:home-2-linear" width="26" height="26"></iconify-icon></span><span data-i18n="nav.home"></span></a>
      <a href="/campo.html" class="flex flex-col items-center gap-1 text-sm font-medium text-muted-foreground">
        <span class="flex h-9 w-16 items-center justify-center"><iconify-icon icon="solar:map-point-linear" width="26" height="26"></iconify-icon></span><span data-i18n="nav.map"></span></a>
      <a href="/panel.html" class="flex flex-col items-center gap-1 text-sm font-semibold text-primary">
        <span class="flex h-9 w-16 items-center justify-center rounded-full bg-primary/10"><iconify-icon icon="mdi:plant" width="26" height="26"></iconify-icon></span><span data-i18n="nav.plan"></span></a>
      <a href="/copiloto.html" class="flex flex-col items-center gap-1 text-sm font-medium text-muted-foreground">
        <span class="flex h-9 w-16 items-center justify-center"><iconify-icon icon="solar:chat-round-dots-linear" width="26" height="26"></iconify-icon></span><span data-i18n="nav.assistant"></span></a>
      <a href="/perfil.html" class="flex flex-col items-center gap-1 text-sm font-medium text-muted-foreground">
        <span class="flex h-9 w-16 items-center justify-center"><iconify-icon icon="solar:user-circle-linear" width="26" height="26"></iconify-icon></span><span data-i18n="nav.profile"></span></a>
    </nav>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/cooperativa.js"></script>
</body>
</html>
