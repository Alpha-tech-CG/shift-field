<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#DEDEDA" />
  <title>Field Shift — Ma parcelle</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="stylesheet" href="/css/fieldshift.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body data-page="map">
  <div class="frame">
    <header id="topbar"></header>

    <div class="page-head">
      <div><h1 data-i18n="field.title"></h1><p class="sub" data-i18n="field.sub"></p></div>
    </div>

    <div class="grid-dash" style="align-items:start">
      <section class="card map-card span-2" style="position:relative">
        <div id="map"></div>
        <div class="map-tools">
          <div class="seg" id="base-seg">
            <button data-base="plan" data-i18n="map.plan"></button>
            <button data-base="sat" class="is-active" data-i18n="map.sat"></button>
          </div>
        </div>
      </section>

      <section class="card stack">
        <p class="muted small" data-i18n="field.draw_hint"></p>
        <div class="wb-box">
          <p class="xs muted" data-i18n="field.selected"></p>
          <p class="num" id="coords" style="font-size:20px;margin-top:4px" data-i18n="field.none"></p>
          <p class="small muted hidden" id="area" style="margin-top:4px"></p>
        </div>
        <a href="/perfil.html" class="btn btn-dark btn-block" id="use-btn">
          <span data-i18n="field.use"></span><iconify-icon icon="solar:alt-arrow-right-linear" width="18" height="18"></iconify-icon>
        </a>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/campo.js"></script>
</body>
</html>
