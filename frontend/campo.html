<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2e9e5b" />
  <title>Field Shift — Campo</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Field Shift" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="offline-banner" data-i18n="common.offline"></div>

  <header class="flex items-center justify-between px-4 py-3">
    <h1 class="font-bold text-lg" data-i18n="field.title"></h1>
    <button onclick="FSI18N.toggle()" class="text-sm border rounded-full px-3 py-1 bg-white" data-i18n="common.lang"></button>
  </header>

  <main class="px-4 max-w-xl mx-auto">
    <p class="text-sm text-gray-600 mb-3" data-i18n="field.help"></p>
    <div id="map"></div>
    <div class="fs-card p-4 mt-4">
      <p class="text-sm text-gray-500" data-i18n="field.selected"></p>
      <p id="coords" class="font-mono font-semibold" data-i18n="field.none"></p>
    </div>
    <a href="/perfil.html" id="use-btn"
       class="block text-center w-full text-white font-bold rounded-2xl py-4 mt-4"
       style="background:var(--fs-green)" data-i18n="field.use"></a>
  </main>

  <nav class="fs-nav">
    <a href="/index.html"><span>🏠</span><span data-i18n="nav.home"></span></a>
    <a href="/campo.html" class="active"><span>🗺️</span><span data-i18n="nav.field"></span></a>
    <a href="/perfil.html"><span>🧑‍🌾</span><span data-i18n="nav.profile"></span></a>
    <a href="/panel.html"><span>📊</span><span data-i18n="nav.panel"></span></a>
    <a href="/copiloto.html"><span>💬</span><span data-i18n="nav.copilot"></span></a>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/campo.js"></script>
</body>
</html>
