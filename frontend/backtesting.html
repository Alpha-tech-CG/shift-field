<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#DEDEDA" />
  <title>Field Shift — Historique</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/fieldshift.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body data-page="history">
  <div class="frame">
    <header id="topbar"></header>

    <div class="page-head">
      <div><h1 data-i18n="bt.title"></h1><p class="sub" data-i18n="bt.subtitle"></p></div>
    </div>

    <div id="loading" class="loading"><div class="spinner"></div><p data-i18n="common.loading"></p></div>

    <main id="content" class="hidden stack">
      <section class="card" style="background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px">
        <span class="q-ico" style="background:rgba(255,255,255,.12);width:56px;height:56px;border-radius:18px"><iconify-icon icon="solar:history-bold" width="28" height="28"></iconify-icon></span>
        <p id="bt-summary" class="num" style="font-size:24px;font-weight:500;line-height:1.25"></p>
      </section>
      <div class="grid-2" id="bt-list"></div>
    </main>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/backtesting.js"></script>
</body>
</html>
