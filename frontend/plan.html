<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#DEDEDA" />
  <title>Field Shift — Plan de culture</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/fieldshift.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body data-page="plan">
  <div class="frame">
    <header id="topbar"></header>

    <div class="page-head">
      <div>
        <h1 data-i18n="plan.title"></h1>
        <p class="sub" id="plan-sub"></p>
      </div>
      <div id="plan-stamp"></div>
    </div>

    <div id="loading" class="loading"><div class="spinner"></div><p data-i18n="common.loading"></p></div>

    <main id="content" class="hidden stack">
      <div class="grid-2">
        <div class="stack">
          <!-- Quand semer -->
          <section class="card reco-card">
            <p class="small muted" data-i18n="panel.timeline"></p>
            <p class="reco-big" id="plant-reco"></p>
            <p class="small muted"><b data-i18n="plant.window"></b> · <span id="plant-window"></span></p>
            <p id="plant-reason" style="margin-top:8px"></p>
            <div class="steps" id="steps"></div>
          </section>

          <!-- Budget d'eau -->
          <section class="card">
            <div class="card-head">
              <h2 class="card-title" data-i18n="panel.water"></h2>
              <span class="badge" id="water-status"></span>
            </div>
            <div class="wb-pair">
              <div class="wb-box"><p class="xs muted" data-i18n="panel.available"></p><p class="num c-blue" id="w-avail"></p></div>
              <div class="wb-box"><p class="xs muted" data-i18n="panel.need"></p><p class="num" id="w-need"></p></div>
            </div>
            <div class="bar"><div id="water-bar" style="width:0%"></div></div>
            <p class="small muted" style="margin-top:10px"><span data-i18n="panel.deficit"></span> : <b class="c-red" id="w-deficit"></b></p>
            <p class="small muted" id="w-explain" style="margin-top:4px"></p>
          </section>

          <!-- Pourquoi ce risque -->
          <section class="card" id="why">
            <div class="card-head">
              <h2 class="card-title" data-i18n="panel.why"></h2>
              <span class="badge" id="risk-badge"></span>
            </div>
            <div id="risk-why"></div>
          </section>
        </div>

        <div class="stack">
          <!-- Rotations -->
          <section class="card">
            <div class="card-head">
              <div><h2 class="card-title" data-i18n="panel.rotations"></h2><p class="card-sub" data-i18n="panel.rotations.sub"></p></div>
            </div>
            <div class="stack" style="gap:12px" id="rotations"></div>
          </section>

          <!-- Explication -->
          <section class="card">
            <div class="card-head">
              <h2 class="card-title" data-i18n="panel.ai"></h2>
              <a class="link-under" href="/copiloto.html" data-i18n="panel.ask"></a>
            </div>
            <p class="muted" id="ai-explain"></p>
          </section>

          <div class="grid-2" style="gap:12px">
            <a class="btn btn-light" href="/cooperativa.html"><iconify-icon icon="solar:printer-linear" width="18" height="18"></iconify-icon><span data-i18n="panel.cooperativa"></span></a>
            <a class="btn btn-dark" href="/backtesting.html"><iconify-icon icon="solar:history-linear" width="18" height="18"></iconify-icon><span data-i18n="bt.open"></span></a>
          </div>
        </div>
      </div>

      <!-- Indicateurs NASA -->
      <section class="card">
        <div class="card-head"><h2 class="card-title" data-i18n="panel.indicators"></h2></div>
        <div class="grid-2">
          <div><p class="xs bold muted" data-i18n="chart.rainfall"></p><div class="chart-box"><canvas id="rain-chart"></canvas></div></div>
          <div><p class="xs bold muted" data-i18n="chart.soil"></p><div class="chart-box"><canvas id="soil-chart"></canvas></div></div>
          <div><p class="xs bold muted" data-i18n="chart.ndvi"></p><div class="chart-box"><canvas id="ndvi-chart"></canvas></div></div>
          <div><p class="xs bold muted" data-i18n="chart.climate"></p><div class="chart-box"><canvas id="climate-chart"></canvas></div></div>
        </div>
        <div class="grid-6" id="indicators" style="margin-top:18px"></div>
      </section>
    </main>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/plan.js"></script>
</body>
</html>
