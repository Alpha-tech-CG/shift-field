<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#DEDEDA" />
  <title>Field Shift — Assistant</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/fieldshift.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body data-page="assistant">
  <div class="frame">
    <header id="topbar"></header>

    <section class="card" style="max-width:920px;margin:0 auto">
      <div class="card-head" style="align-items:center;flex-wrap:wrap">
        <div style="display:flex;gap:14px;align-items:center">
          <span class="bot-av" style="width:54px;height:54px;border-radius:18px"><iconify-icon icon="solar:stars-bold" width="28" height="28"></iconify-icon></span>
          <div><h1 class="card-title" style="font-size:26px" data-i18n="copilot.title"></h1><p class="card-sub" data-i18n="copilot.subtitle"></p></div>
        </div>
        <span class="badge badge-gray hidden" id="ctx-chip"></span>
      </div>

      <div class="chat" id="chat"></div>
      <div class="chips" id="chips"></div>
      <form id="chat-form" style="display:flex;gap:10px;align-items:center">
        <input id="q" class="input" type="text" autocomplete="off" data-i18n-ph="copilot.placeholder" />
        <button class="send" aria-label="Envoyer"><iconify-icon icon="solar:plain-2-bold" width="22" height="22"></iconify-icon></button>
      </form>
      <p class="xs faint" style="text-align:center;margin-top:12px" data-i18n="copilot.disclaimer"></p>
    </section>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/copiloto.js"></script>
</body>
</html>
