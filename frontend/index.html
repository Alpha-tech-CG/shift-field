<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#DEDEDA" />
  <title>Field Shift</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Field Shift" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/fieldshift.css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>
<body data-page="home">
  <div class="frame">
    <header id="topbar"></header>

    <section class="hero home-hero" style="background-image:url('/img/field.jpg')">
      <div class="hero-card">
        <p class="eyebrow" data-i18n="home.eyebrow"></p>
        <h1 data-i18n="app.tagline" style="margin-top:6px"></h1>
        <p data-i18n="home.subtitle"></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
          <a class="btn btn-dark" href="/campo.html"><span data-i18n="home.start"></span><iconify-icon icon="solar:alt-arrow-right-linear" width="18" height="18"></iconify-icon></a>
          <a class="btn btn-light hidden" id="cta-dash" href="/panel.html" data-i18n="home.dashboard"></a>
        </div>
      </div>
    </section>

    <h2 style="margin:28px 4px 14px;font-size:22px" data-i18n="home.questions"></h2>
    <div class="grid-4">
      <div class="card q-card">
        <span class="q-ico" style="background:var(--amber-soft);color:var(--amber)"><iconify-icon icon="solar:danger-triangle-bold" width="24" height="24"></iconify-icon></span>
        <p class="bold" data-i18n="home.q1"></p>
      </div>
      <div class="card q-card">
        <span class="q-ico" style="background:#E3EEFE;color:var(--blue)"><iconify-icon icon="solar:waterdrops-bold" width="24" height="24"></iconify-icon></span>
        <p class="bold" data-i18n="home.q2"></p>
      </div>
      <div class="card q-card">
        <span class="q-ico" style="background:var(--yellow-soft);color:var(--yellow-600)"><iconify-icon icon="solar:calendar-bold" width="24" height="24"></iconify-icon></span>
        <p class="bold" data-i18n="home.q3"></p>
      </div>
      <div class="card q-card">
        <span class="q-ico" style="background:var(--green-soft);color:var(--green)"><iconify-icon icon="mdi:sprout" width="24" height="24"></iconify-icon></span>
        <p class="bold" data-i18n="home.q4"></p>
      </div>
    </div>

    <a class="card" href="/backtesting.html" style="display:flex;align-items:center;gap:16px;margin-top:18px">
      <span class="q-ico" style="background:var(--ink);color:#fff"><iconify-icon icon="solar:history-bold" width="24" height="24"></iconify-icon></span>
      <div style="flex:1"><p class="card-title" data-i18n="home.backtest"></p><p class="card-sub" data-i18n="bt.subtitle"></p></div>
      <span class="round-btn"><iconify-icon icon="solar:alt-arrow-right-linear" width="18" height="18"></iconify-icon></span>
    </a>

    <p class="xs faint" style="text-align:center;margin-top:22px">NASA · GPM IMERG · SMAP · MODIS · NASA POWER · GRACE-FO</p>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    if (FSStore.getField()) document.getElementById("cta-dash").classList.remove("hidden");
  </script>
</body>
</html>
