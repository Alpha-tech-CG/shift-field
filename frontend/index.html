<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2e9e5b" />
  <title>Field Shift</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="offline-banner" data-i18n="common.offline"></div>

  <header class="flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-2">
      <img src="/icons/icon.svg" alt="" class="w-8 h-8" />
      <span class="font-bold text-lg" style="color:var(--fs-green)" data-i18n="app.name"></span>
    </div>
    <button onclick="FSI18N.toggle()" class="text-sm border rounded-full px-3 py-1 bg-white" data-i18n="common.lang"></button>
  </header>

  <main class="px-4 max-w-xl mx-auto">
    <section class="text-center mt-4">
      <h1 class="text-3xl font-extrabold mb-2" data-i18n="home.title"></h1>
      <p class="text-base text-gray-600 mb-1" data-i18n="home.subtitle"></p>
      <p class="font-semibold mb-4" style="color:var(--fs-green)" data-i18n="app.tagline"></p>
      <p class="text-sm text-gray-600 mb-6" data-i18n="home.intro"></p>
      <a href="/campo.html"
         class="inline-block w-full text-white font-bold text-lg rounded-2xl py-4"
         style="background:var(--fs-green)" data-i18n="home.start"></a>
    </section>

    <section class="grid gap-3 mt-8">
      <div class="fs-card p-4 flex items-start gap-3">
        <span class="text-2xl">🌡️</span><p class="text-sm" data-i18n="home.q1"></p>
      </div>
      <div class="fs-card p-4 flex items-start gap-3">
        <span class="text-2xl">💧</span><p class="text-sm" data-i18n="home.q2"></p>
      </div>
      <div class="fs-card p-4 flex items-start gap-3">
        <span class="text-2xl">📅</span><p class="text-sm" data-i18n="home.q3"></p>
      </div>
      <div class="fs-card p-4 flex items-start gap-3">
        <span class="text-2xl">🌱</span><p class="text-sm" data-i18n="home.q4"></p>
      </div>
    </section>

    <p class="text-center text-xs text-gray-400 mt-8">
      NASA Space Apps Challenge · GPM · SMAP · MODIS · NASA POWER · GRACE-FO
    </p>
  </main>

  <nav class="fs-nav">
    <a href="/index.html" class="active"><span>🏠</span><span data-i18n="nav.home"></span></a>
    <a href="/campo.html"><span>🗺️</span><span data-i18n="nav.field"></span></a>
    <a href="/perfil.html"><span>🧑‍🌾</span><span data-i18n="nav.profile"></span></a>
    <a href="/panel.html"><span>📊</span><span data-i18n="nav.panel"></span></a>
    <a href="/copiloto.html"><span>💬</span><span data-i18n="nav.copilot"></span></a>
  </nav>

  <script src="/js/i18n.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
